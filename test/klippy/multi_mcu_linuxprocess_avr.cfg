# Linux-host + AVR multi-MCU config -- atmega2560 main (steppers
# + timing reference) and linuxprocess satellite under the conventional
# `host` mcu name (the same name generic-replicape.cfg uses for its
# BeagleBone host coprocessor). The host mcu is declared but carries
# no peripherals so klippy doesn't try to ioctl /dev/gpiochipN against
# the linuxprocess binary -- the validation goal is just that klippy
# successfully identifies both MCUs in parallel across two backends
# (simavr-bridged AVR + native linuxprocess pty).
[mcu]
serial: __EMULATOR_PTY__

[mcu host]
serial: __EMULATOR_PTY__

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
