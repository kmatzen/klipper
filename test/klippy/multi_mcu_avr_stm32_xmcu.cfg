# Cross-architecture cross-MCU stepper config -- atmega2560 main runs
# X/Y, stm32f103 satellite (`other:` prefix) runs Z. Exercises the
# fixture pusher's MCU-prefix routing across the architecture
# boundary: _PIN_RE captures `other:` on the Z step/dir/enable/endstop
# pins and the runner emits the Z step_trigger command on the renode
# bridge's control socket while X/Y step_triggers go to the simavr
# bridge. Without per-bridge routing, the prefixed pins would be
# skipped entirely and Z homing would hang. Z pin layout cribbed from
# generic-bigtreetech-skr-cr6 (a known-good stm32f103 board).
[mcu]
serial: __EMULATOR_PTY__

[mcu other]
serial: __EMULATOR_PTY__

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: other:PB0
dir_pin: !other:PC5
enable_pin: !other:PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^other:PC2
position_endstop: 0.0
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
