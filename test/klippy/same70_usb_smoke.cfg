# SAME70Q20B USB-CDC boot/connect smoke test config. Exercises the
# CONFIG_ATSAM_USB firmware variant (no UART host link - klippy
# connects via the synthetic USBHS pty exposed by Renode through
# test/emulator/repl/same70_usbhs.cs). Stepper pins cribbed from
# generic-duet3-6hc's stepper_x; PB10/PB11 (USB D+/D-) are reserved
# by RESERVE_PINS_USB and avoided. PD25 (the UART2 host link in the
# serial-mode build) is free to use here since the USB-CDC firmware
# has no UART2 reservation.
[manual_stepper basic_stepper]
step_pin: PC18
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
