# SAMD21 boot/connect smoke test config. Exercises the full Renode
# SAMD21G18 platform path: SystemInit clock setup (GCLK/SYSCTRL stubs),
# TC4 32-bit timer, SERCOM0 host link on PA10/PA11, and PORT pin
# muxing on a handful of pads. Avoids PA10/PA11 (host link).
[manual_stepper basic_stepper]
step_pin: PA4
dir_pin: PA5
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
