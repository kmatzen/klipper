# Duet3 6XD (SAME70Q20B) end-to-end EMULATOR test config. Mirrors
# generic-duet3-6xd.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode UART2 pty on PD25/PD26), stepper_x's
# endstop moved off PD25 (the UART2 RX pin) to PD30 (IO4_in), and the
# duplicated [heater_fan heatbreak_fan] section's second instance
# renamed. The 6XD is the EXTERNAL-driver Duet3 variant: plain
# step/dir/enable to off-board drivers (no onboard TMC), so this test
# has no TMC SPI - it exercises the SAME70 backend + adc_scaled
# vref/vssa-compensated thermistor on the AFEC + steppers + endstops +
# software-PWM heater/fans. The board is USB+CAN only, but the pin map
# is host-link independent, so it runs the serial-mode build
# (same70q20b.dict) in deterministic tick mode (free-run SAME70
# clocksync drifts under load).

[stepper_x]
step_pin: PC18
dir_pin: PB5
enable_pin: PB4
microsteps: 128
rotation_distance: 40
endstop_pin: PD30
position_endstop: 0
position_max: 450

[stepper_y]
step_pin: PC16
dir_pin: PD10
enable_pin: PA21
microsteps: 128
rotation_distance: 40
endstop_pin: PD15
position_endstop: 0
position_max: 450

[stepper_z]
step_pin: PC28
dir_pin: PA4
enable_pin: PC20
microsteps: 64
rotation_distance: 8
endstop_pin: PD28
position_endstop: 0
position_min: 0
position_max: 400

[adc_scaled vref_scaled]
vref_pin: PC30
vssa_pin: PC13

[extruder]
step_pin: PC1
dir_pin: PA22
enable_pin: PA23
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA24
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
sensor_pin: vref_scaled:PC29
control: pid
pid_Kp: 30.089
pid_Ki: 2.229
pid_Kd: 101.550
min_temp: 0
max_temp: 285

[heater_fan heatbreak_fan]
pin: PC8
heater: extruder
heater_temp: 50.0

[heater_fan board_fan]
pin: PA15

[fan]
pin: PC5

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 3000
