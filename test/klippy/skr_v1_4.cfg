# BIGTREETECH SKR V1.4 (NXP LPC1768) end-to-end EMULATOR test config.
# Mirrors generic-bigtreetech-skr-v1.4.cfg with the host-link serial
# path swapped to __EMULATOR_PTY__ (the Renode UART0 pty on P0.3/P0.2)
# and the four steppers driven by TMC2208s in single-wire UART mode -
# the board's canonical Trinamic option (the stock config ships the
# [tmc2208 ...] blocks commented out).
#
# This is the per-printer counterpart to lpc176x_smoke (boot only) and
# the LPC176x sibling of skr_pico (RP2040) / skr_mini_e3_v2 (STM32F103).
# What it adds over those: the TMC2208s use SINGLE-WIRE-PER-DRIVER UART -
# each driver has its own dedicated uart_pin (rx == tx, no tx_pin), all
# at datagram address 0 - rather than the four-drivers-on-one-bus
# multi-drop addressing skr_pico / skr_mini_e3_v2 exercise. The
# renode_hooks sw_uart responder broadcasts each framed reply onto every
# registered RX pin (it can't tell from a TMC2208 request which pin it
# targets), and klippy's strictly-sequential per-driver init reading from
# the shared register file lines up. It also exercises the IRQ-DRIVEN LPC
# ADC (test/emulator/repl/lpc176x_adc.cs): klipper's src/lpc176x/adc.c
# collects samples in ADC_IRQHandler (burst mode), so the polled ADC
# stubs the other chips use don't fit - the C# model raises the ADC IRQ.
# Two 100K thermistors read through ADC channels 1 (P0.24, extruder) and
# 2 (P0.25, bed); see src/lpc176x/adc.c adc_pins[] for the pin->channel
# map.
#
# The real SKR V1.4 talks over its USB-CDC or the UART0 host header; the
# LPC176x Renode platform models UART0 (NS16550), so the firmware is the
# generic serial-mode lpc176x build (lpc176x.dict, host link on
# P0.3/P0.2) and the test exercises the pin map, which is independent of
# the host link. As with skr_pico / skr_mini_e3_v2, the gated path is
# motion-free.

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: P1.10
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.28
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: P1.9
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: !P1.27
position_endstop: 0.0
position_max: 300

[tmc2208 stepper_z]
uart_pin: P1.8
run_current: 0.650
stealthchop_threshold: 999999

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 260

[tmc2208 extruder]
uart_pin: P1.4
run_current: 0.800
stealthchop_threshold: 999999

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 500
max_z_velocity: 10
max_z_accel: 100
