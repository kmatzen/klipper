# BIGTREETECH Octopus Pro v1.0 (STM32H723 variant) end-to-end EMULATOR
# test config. Based on generic-bigtreetech-octopus-pro-v1.0.cfg (H723
# build) with the host-link serial path swapped to __EMULATOR_PTY__ (the
# Renode USART1 pty on PA9/PA10), the USB-only bits stripped, and two
# adaptations the emulator requires (both documented inline):
#
#   1. Drivers run as TMC5160 over SPI to exercise the renode_hooks TMC
#      SPI chain responder on STM32. klipper's src/stm32/spi.c has no
#      hardware-SPI bus table for MACH_STM32H7 (it covers F0/F1/F2/F4/
#      F7/G0/G4/L4 only), so H7 boards drive SPI in SOFTWARE - exactly
#      what this config does (spi_software_*_pin). Both the hardware and
#      software SPI paths funnel through the single firmware function
#      spidev_transfer() (src/spicmds.c), which the responder hooks and
#      PC-skips, synthesising the MISO datagram in place - so the
#      software-SPI path is driven by the same hook as the SAME70
#      hardware-USART-SPI duet3_6hc test.
#   2. Thermistors are moved to ADC1 pins PC0 (extruder) / PC3 (bed). On
#      the real board T0/TB are PF4/PF3, which on the H7 resolve to ADC3
#      (a separate D3-domain peripheral at 0x58026000); keeping every
#      analog channel on ADC1 lets the single test/emulator/
#      stm32h7_adc_stub.py at 0x40022000 serve them. (H7 ADC1 channel ==
#      index in src/stm32/stm32h7_adc.c adc_pins[]: PC0=10, PC3=13.)
#
# This is the STM32H7 per-printer test (sibling of duet3_6hc on SAME70
# for the SPI path and skr_mini_e3_v3 on G0 / fysetc_spider on F4 for the
# UART path). The pin map this test exercises is independent of the host
# link, so it runs the generic serial-mode stm32h723 build
# (stm32h723.dict); the real board is USB+CAN, which the STM32H7 Renode
# platform does not model.

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.800
sense_resistor: 0.075

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc5160 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.800
sense_resistor: 0.075

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PG10
position_endstop: 0.0
position_max: 350

[tmc5160 stepper_z]
cs_pin: PC6
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.800
sense_resistor: 0.075

[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 285

[tmc5160 extruder]
cs_pin: PC7
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.600
sense_resistor: 0.075

[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PA8

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100
