# SAMD21G18 (Microchip Cortex-M0+) end-to-end EMULATOR test config.
#
# Unlike the other per-printer tests there is no shipped config/ board
# for the SAMD21G18, so this is a synthetic but realistically-shaped
# cartesian printer (4 axes, 4 TMC2209s on a shared multi-drop UART, 2
# software-PWM heaters, a fan, 2 thermistors). Its purpose is to drive
# the SAMD21 (M0+, no DWT - timed off the TC4 32-bit chained timer)
# through the same TMC-UART + ADC infrastructure the real-board
# per-printer tests use, where samd21_smoke only verifies boot.
#
# What it exercises beyond the smoke test:
#   - TMC2209 MULTI-DROP UART. All four drivers share uart_pin PA6 /
#     tx_pin PA7 with per-driver uart_address 0..3, reusing the
#     renode_hooks sw_uart responder. _drive_rx drives the firmware-side
#     RX bit through the SAMD21 PORT model (gpio_a.OnGPIO), which
#     samd21g18.repl already declares (GPIOPort.SAMD21_GPIO). A single
#     shared state + register file serves all four addresses because
#     klippy initialises drivers sequentially (the same multidrop path
#     skr_pico / skr_mini_e3_v3 / duet3_mini exercise). This is also the
#     first SAMD-family sw_uart test, which is why renode_hooks now
#     resolves the CPU as either sysbus.cpu or sysbus.cpu0 (the SAMD
#     repls name it cpu0) before attaching the tmcuart PC hooks.
#   - The SAMD21 ADC (0x42004000), served by the new
#     test/emulator/samd21_adc_stub.py. The hotend reads through ADC
#     channel index 4 (PA4) and the bed through index 5 (PA5) - see
#     adc_pins[] in src/atsamd/adc.c (CONFIG_MACH_SAMD21).
#
# Host link is SERCOM0 on PA10/PA11 (samd21g18-serial build); those pins
# are reserved. The gated path is motion-free.

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA12
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PA6
tx_pin: PA7
uart_address: 0
run_current: 0.600
stealthchop_threshold: 999999

[stepper_y]
step_pin: PA3
dir_pin: PA8
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA13
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PA6
tx_pin: PA7
uart_address: 1
run_current: 0.600
stealthchop_threshold: 999999

[stepper_z]
step_pin: PA9
dir_pin: PA14
enable_pin: !PA2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA15
position_endstop: 0.0
position_max: 200

[tmc2209 stepper_z]
uart_pin: PA6
tx_pin: PA7
uart_address: 2
run_current: 0.600
stealthchop_threshold: 999999

[extruder]
step_pin: PA16
dir_pin: PA17
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA18
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PA6
tx_pin: PA7
uart_address: 3
run_current: 0.600
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA19
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA5
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PA22

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
