# SAM4S8C boot/connect smoke test config. Exercises the upstream
# Renode sam4s8b platform (memory layout matches sam4s8c: 512KB
# flash + 128KB sram, so we point at upstream verbatim in
# renode_launcher.py rather than carrying a duplicate locally).
# UART1 host link on PB2/PB3. Stepper pins cribbed from
# generic-duet2-maestro.cfg's stepper_x.
[manual_stepper basic_stepper]
step_pin: PC20
dir_pin: PC18
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
