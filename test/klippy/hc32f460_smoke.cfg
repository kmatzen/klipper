# HC32F460 boot/connect smoke test config. Exercises the local
# hc32f460.repl plus the C# HC32F460_USART model
# (test/emulator/repl/hc32f460_uart.cs, loaded into the runtime via
# `i @file.cs` before LoadPlatformDescription) plus the storeback
# stubs for INTC/PORT/PWC/SYSREG/EFM/AOS/MSTP regions. USART1 host
# link on PA3/PA2 (the PA3PA2 dict variant). Stepper pins cribbed
# from printer-creality-ender2pro-hc32-2022.cfg's stepper_x. Avoids
# PA3/PA2 (host link).
[manual_stepper basic_stepper]
step_pin: PC1
dir_pin: PC0
enable_pin: !PC2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
