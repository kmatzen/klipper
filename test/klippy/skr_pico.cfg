# BIGTREETECH SKR Pico v1.0 (RP2040) end-to-end EMULATOR test config.
# Mirrors generic-bigtreetech-skr-pico-v1.0.cfg with the host-link
# serial path swapped to __EMULATOR_PTY__ (the Renode uart0 pty on
# gpio0/gpio1, which this board leaves free) and the USB-only +
# timing-peripheral bits stripped: the real board talks native USB-CDC,
# which the RP2040 Renode platform has no model for, so the test builds
# the firmware in serial mode (the generic rp2040 dict/elf the smoke
# test uses) and exercises the printer pin map, which is identical
# regardless of host link. The [temperature_sensor pico] (temperature_mcu)
# and [neopixel] sections are omitted - the former needs the ADC temp-
# sensor channel's mcu-temp conversion, the latter needs RP2040 PIO
# timing - neither of which is part of the stepper/TMC/thermistor pin
# map this test targets.
#
# This is the RP2040 sibling of skr_mini_e3_v2 (STM32F103) and
# duet2_maestro (SAM4S). Like skr_mini_e3_v2 it drives four TMC2209s on
# a shared software-UART bus (gpio9 rx / gpio8 tx) addressed by
# multi-drop uart_address (0/2/1/3), reusing renode_hooks.sw_uart. Its
# thermistors read through test/emulator/rp2040_adc_stub.py, which drives
# klipper's RP2040 ADC handshake (the local rp2040.repl models no ADC).

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio4
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio25
position_endstop: 0.0
position_max: 250

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18

[heater_fan controller_fan]
pin: gpio20

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
