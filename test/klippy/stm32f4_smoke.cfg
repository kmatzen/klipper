# STM32F4 boot/connect smoke test config. Exercises the Renode
# stm32f4 platform path: upstream Miscellaneous.STM32F4_RCC drives the
# HSE/PLL clock setup in src/stm32/stm32f4.c, the upstream TIM2 model
# advances generic/armcm_timer's view of the system clock, and USART1
# (PA9/PA10) is the host link Renode exposes as a pty. The local
# stm32f4.repl additionally maps ADC1/2/3 (upstream omits Analog
# peripherals); this smoke config doesn't read a thermistor, so it
# only verifies the boot/identify/clocksync path. Stepper pins avoid
# PA9/PA10 (host link).
[manual_stepper basic_stepper]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
