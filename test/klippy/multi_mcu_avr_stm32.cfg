# Cross-architecture multi-MCU config -- atmega2560 main + stm32f103
# satellite. All steppers live on the main AVR so the existing
# auto_trsync_trigger_ticks step-counter routing is exercised on the
# simavr side; the stm32 satellite is along for the ride to validate
# that klippy's reactor simultaneously talks to a renode-backed bridge
# and a simavr-backed bridge over their respective ptys.
[mcu]
serial: __EMULATOR_PTY__

[mcu other]
serial: __EMULATOR_PTY__

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
