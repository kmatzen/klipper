# Minimal SAME70 TMC5160 SPI daisy-chain probe. Three steppers driven
# by three TMC5160s on a shared SPI bus (usart1 in SPI mode, shared
# cs_pin PD17, chain_length 3). Isolates the renode_hooks TMC SPI chain
# responder (CPU-PC hook on spidev_transfer) from the adc_scaled / AFEC
# thermistor path of the full duet3-6hc config.
[stepper_x]
step_pin: PC18
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PA17
position_endstop: 0
position_max: 200

[tmc5160 stepper_x]
cs_pin: PD17
spi_bus: usart1
chain_position: 1
chain_length: 3
run_current: 1.0
sense_resistor: 0.05

[stepper_y]
step_pin: PC16
dir_pin: PD10
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PA18
position_endstop: 0
position_max: 200

[tmc5160 stepper_y]
cs_pin: PD17
chain_position: 2
chain_length: 3
run_current: 1.0
sense_resistor: 0.05

[stepper_z]
step_pin: PC28
dir_pin: PA4
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: PA19
position_endstop: 0
position_max: 200

[tmc5160 stepper_z]
cs_pin: PD17
chain_position: 3
chain_length: 3
run_current: 1.0
sense_resistor: 0.05

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
