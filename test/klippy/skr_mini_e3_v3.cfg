# BIGTREETECH SKR mini E3 v3.0 (STM32G0B1) end-to-end EMULATOR test
# config. Mirrors generic-bigtreetech-skr-mini-e3-v3.0.cfg with the
# host-link serial path swapped to __EMULATOR_PTY__ (the Renode USART1
# pty on PA9/PA10) and the USB-only bits stripped: the real board talks
# native USB-CDC, which the STM32G0 Renode platform has no model for, so
# the test builds the firmware in serial mode (the same generic
# stm32g0b1 dict/elf the smoke test uses) and exercises the printer's
# *pin map* - which is identical regardless of host link.
#
# This is the per-printer counterpart to stm32g0_smoke (boot only) and
# the STM32G0 sibling of skr_mini_e3_v2 (STM32F103). It is in fact the
# direct successor board: same four TMC2209s sharing a single
# software-UART bus (PC11 rx / PC10 tx) addressed by MULTI-DROP
# uart_address (0/2/1/3), so it reuses the renode_hooks sw_uart hook and
# shared TMC register file unchanged. What it newly exercises is the G0
# ADC: thermistors on ADC1 channel 0 (PA0, extruder) and channel 17
# (PC4, bed), read through test/emulator/stm32g0_adc_stub.py - the
# G0/F0-family ADC (ISR/CR/CHSELR/DR) has a completely different register
# layout from the F1/F4 ADC the skr_mini_e3_v2 test uses, so it needs its
# own stub. (G0 ADC channel == index in src/stm32/stm32f0_adc.c
# adc_pins[]: PA0=0, PC4=17.)

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.0
position_max: 250

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[fan]
pin: PC6

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
