# STM32F103 boot/connect smoke test config. Exercises the full Renode
# stm32f103 platform path: SystemInit clock setup against the local
# rcc_stub (HSERDY/PLLRDY synthesis), TIM2 driving generic/armcm_timer,
# USART1 host link on PA9/PA10, plus a handful of GPIO pin muxes on
# port B. Avoids PA9/PA10 (host link).
[manual_stepper basic_stepper]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
