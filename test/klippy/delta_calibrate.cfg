# Test config for the DELTA_CALIBRATE command (on linear delta robots)
#
# rotation_distance is the real-world delta value (40 mm/rev, GT2 belt
# on a 20-tooth pulley) rather than the contrived 0.32 the saved
# heightN_pos block was originally generated against. At 0.32, with
# microsteps=16 and homing_speed=50, each tower would have to issue
# step pulses at ~500 kHz - well above what an AVR atmega2560 can
# sustain, so the test only worked against the legacy fileoutput stub
# (no real MCU timing). The saved heightN_pos values below have been
# rescaled by the same factor (0.32 / 40 = 1/125) so DELTA_ANALYZE's
# stable-position math stays self-consistent at config-load; the
# DELTA_CALIBRATE METHOD=manual run that the .test drives later
# overwrites them with fresh probe positions before extended
# calibration runs.
[stepper_a]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
homing_speed: 50
#position_endstop: 297.05
#arm_length: 333.0

[stepper_b]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ0

[stepper_c]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: delta
max_velocity: 300
max_accel: 3000
#delta_radius: 174.75

[delta_calibrate]
radius: 50

