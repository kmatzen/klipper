# Exercises periodic ADC sampling end-to-end through the emulator.
# A temperature_sensor configured with a real thermistor sends
# query_analog_in to the MCU; the firmware would then emit
# analog_in_state at the requested cadence. The emulator simulates
# that firmware-driven cadence using the ADC values from the fixture.

[manual_stepper basic_stepper]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[temperature_sensor my_thermistor]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
min_temp: 0
max_temp: 250

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
