# UltiMachine Archim2 (Atmel SAM3X8E) end-to-end EMULATOR test config.
# Mirrors generic-archim2.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode UART pty on PA8/PA9, the sam3x8e-serial
# firmware build).
#
# This is the SAM3X per-printer counterpart to sam3x_smoke (boot only).
# What it adds over the smoke test, reusing existing infrastructure:
#
#   - TMC2130 over SOFTWARE SPI. The four drivers each have their own
#     cs_pin and share the bit-banged spi_software_{sclk,mosi,miso} pins
#     (PD2/PD3/PD1). Software SPI still routes every datagram through the
#     firmware's spidev_transfer (src/spicmds.c), which is the single
#     hw+sw SPI chokepoint the renode_hooks spi_tmc PC-skip responder
#     hooks - so the same TMC SPI chain responder duet3-6hc / octopus-pro
#     use serves these reads unchanged (5-byte datagrams, IOIN
#     version=0x30).
#   - The SAM3X ADC (0x400C0000). src/atsam/adc.c is shared with SAM4S
#     and register-identical, so test/emulator/sam4s_adc_stub.py serves
#     it verbatim at the SAM3X base. The hotend reads through ADC channel
#     index 12 (PB19, ATC Semitec 104GT-2) and the bed through index 13
#     (PB20, EPCOS 100K) - see adc_pins[] in src/atsam/adc.c (g.chan is
#     the one-hot mask 1<<chan, which the stub decodes).
#
# Trimmed relative to the shipped config: the [board_pins] display
# aliases, the commented second extruder, and heater_fan are dropped.
# The real Archim2 host link is USB; the firmware here is the generic
# serial-mode sam3x8e build and the test exercises the pin map, which is
# independent of the host link. The gated path is motion-free.

[stepper_x]
step_pin: PC6
dir_pin: PC5
enable_pin: !PC9
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD4
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2130 stepper_x]
cs_pin: PC7
run_current: .5
sense_resistor: 0.120
spi_software_sclk_pin: PD2
spi_software_mosi_pin: PD3
spi_software_miso_pin: PD1

[stepper_y]
step_pin: PC12
dir_pin: PC11
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD6
position_endstop: 0
position_max: 400
homing_speed: 50

[tmc2130 stepper_y]
cs_pin: PC13
run_current: .5
sense_resistor: 0.120
spi_software_sclk_pin: PD2
spi_software_mosi_pin: PD3
spi_software_miso_pin: PD1

[stepper_z]
step_pin: PC17
dir_pin: PC16
enable_pin: !PC19
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop: 0
position_max: 400
homing_speed: 50

[tmc2130 stepper_z]
cs_pin: PC18
run_current: .5
sense_resistor: 0.120
spi_software_sclk_pin: PD2
spi_software_mosi_pin: PD3
spi_software_miso_pin: PD1

[extruder]
step_pin: PB10
dir_pin: PC10
enable_pin: !PB22
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC24
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB19
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2130 extruder]
cs_pin: PC20
run_current: .5
sense_resistor: 0.120
spi_software_sclk_pin: PD2
spi_software_mosi_pin: PD3
spi_software_miso_pin: PD1

[heater_bed]
heater_pin: PC21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB20
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PC26

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
