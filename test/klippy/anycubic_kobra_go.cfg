# Anycubic Kobra Go (HDSC HC32F460) end-to-end EMULATOR test config.
# Mirrors printer-anycubic-kobra-go-2022.cfg with the host-link serial
# path swapped to __EMULATOR_PTY__ (the Renode USART1 pty on PA3/PA2,
# the hc32f460-serial-PA3PA2 firmware build).
#
# This is the HC32F460 per-printer counterpart to hc32f460_smoke (boot
# only). What it adds over the smoke test: it brings up the full board
# pin map and reads both thermistors through the HC32 ADC. The Kobra Go
# uses plain step/dir/enable drivers (no Trinamic UART/SPI), so unlike
# the other per-printer tests there is no TMC round-trip - the new
# infrastructure it exercises is the HC32 ADC (M4_ADC1 @ 0x40040000),
# which the hc32f460.repl does not model and which klipper's
# src/hc32f460/adc.c drives through an STR-start / ISR-EOCAF /
# DRn-result handshake. test/emulator/hc32f460_adc_stub.py serves that
# handshake; without it both heaters read temp=0.0. The hotend
# thermistor reads through ADC channel 13 (PC3, ATC Semitec 104GT-2)
# and the bed through channel 11 (PC1, EPCOS 100K) - see adc_gpio[] in
# src/hc32f460/adc.c.
#
# Trimmed relative to the shipped config: the probe / bed_mesh /
# safe_z_home sections are dropped (they need motion + a probe pin that
# the no-homing emulator path does not exercise). The gated path is
# motion-free, like the other per-printer tests.

[stepper_x]
step_pin: PA12
dir_pin: PA11
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: !PH2
position_endstop: -13
position_min:-13
position_max: 236
homing_speed: 50

[stepper_y]
step_pin: PA9
dir_pin: PA8
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC13
position_endstop: -9
position_min:-9
position_max: 230
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC14
position_endstop: 0
position_min: -10
position_max: 255
homing_speed: 5

[extruder]
step_pin: PB15
dir_pin: PB14
enable_pin: !PA15
microsteps: 16
rotation_distance: 31.07
max_extrude_only_velocity: 25
max_extrude_only_accel: 1000
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_extrude_temp: 170
min_temp: 0
max_temp: 250
control: pid
pid_kp: 19.56
pid_ki: 1.62
pid_kd: 200.00

[heater_bed]
heater_pin: PB9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: 0
max_temp: 120
control: pid
pid_kp: 97.1
pid_ki: 1.41
pid_kd: 1675.16

[heater_fan extruder_fan]
pin: PB13

[fan]
pin: PB5
cycle_time: 0.00005

[output_pin enable_pin]
pin: PB6
value: 1

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 500
max_z_velocity: 4
max_z_accel: 100
