# Boot/connect smoke test config for the PRU host-emulation build.
# Exercises the full src/pru/ path under host gcc: timer_init +
# timer_kick programming the host IEP model, irq_wait blocking on
# the host condvar, console_task pulling commands from
# SHARED_MEM->next_command (driven by the pty I/O thread in
# src/pru/host_pru.c), and host_pru_send_response writing klipper
# response frames straight to the pty for klippy to read back.
[manual_stepper basic_stepper]
step_pin: gpio1_12
dir_pin: gpio1_13
enable_pin: !gpio1_14
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
