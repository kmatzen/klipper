# STM32H7 boot/connect smoke test config. Exercises the Renode
# stm32h7 platform path: the local stm32h723.repl inherits upstream
# stm32h743.repl (Renode ships no h723), whose Miscellaneous.STM32H7_RCC
# drives the HSE/PLL clock setup in src/stm32/stm32h7.c. The system
# tick advances generic/armcm_timer's view of the clock; USART1 is the
# host link Renode exposes as a pty. Stepper pins avoid the USART1
# host-link pins (PA9/PA10).
[manual_stepper basic_stepper]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
