# SAMD51 boot/connect smoke test config. Exercises the full Renode
# SAMD51P20 platform path: SystemInit clock setup (OSCCTRL/GCLK/
# OSC32KCTRL synthesis stubs) + MCLK/CMCC storeback, the upstream
# SAMD5_UART (SERCOM0) host link on PA10/PA11, and PORT pin muxing
# on a handful of pads. Avoids PA10/PA11 (host link).
[manual_stepper basic_stepper]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
