# FYSETC Spider (STM32F446) end-to-end EMULATOR test config. Mirrors
# generic-fysetc-spider.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode USART1 pty on PA9/PA10) and the USB-only
# bits stripped: the real board talks native USB-CDC, which the STM32F4
# Renode platform has no model for, so the test builds the firmware in
# serial mode (the same generic stm32f446 dict/elf the smoke test uses)
# and exercises the printer's *pin map* - which is identical regardless
# of host link.
#
# This is the per-printer counterpart to stm32f4_smoke (boot only) and
# the STM32F4 entry in the per-printer matrix. What it newly exercises:
#
#   - TMC2208 SINGLE-WIRE-PER-DRIVER UART: each driver has its own
#     dedicated uart_pin (PE7 / PE15 / PD10 / PD7), rx==tx, no shared bus
#     and no datagram address (TMC2208 has no address field). This is the
#     same renode_hooks sw_uart path the SKR v1.4 (LPC176x) test uses -
#     the responder registers one state per pin and BROADCASTS the framed
#     reply onto every registered RX pin, since it can't tell which pin a
#     given bit-banged request targets; klippy initialises and reads the
#     drivers strictly sequentially against a shared register file, so the
#     reply content is correct for whichever driver is live. It exercises
#     the STM32 GPIO OnGPIO drive in that broadcast path (the LPC test
#     drives the LPC FIOPIN; here it is gpioPortE / gpioPortD OnGPIO).
#   - STM32F4 ADC: thermistors on ADC1 channel 10 (PC0, extruder) and
#     channel 13 (PC3, bed), read through test/emulator/stm32_adc_stub.py.
#     F4 shares src/stm32/adc.c (and the SR/CR2/SQR3/DR register slice)
#     with F1, so it reuses the F1 ADC stub; the only difference the stub
#     absorbs is the ADC_CR2 SWSTART bit (bit22 on F1, bit30 on F4). The
#     local stm32f4.repl maps no Analog peripheral, so the launcher's stub
#     at 0x40012000 is the only thing there (F4 channel == index in
#     src/stm32/adc.c adc_pins[]: PC0=10, PC3=13).

[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB14
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: PE7
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: PE15
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA0
position_endstop: 0.0
position_max: 250

[tmc2208 stepper_z]
uart_pin: PD10
run_current: 0.800
stealthchop_threshold: 999999

[extruder]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2208 extruder]
uart_pin: PD7
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PB0

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
