# SAM4E8E boot/connect smoke test config. Exercises the local
# sam4e8e.repl (standalone - cannot inherit from sam4s.repl because
# of address conflicts: SAM4E PIOD/WDT/ADC live where SAM4S has
# RSTC/nothing/the wrong ADC base). UART0 host link on PA9/PA10;
# AFEC0/AFEC1 stub regions at 0x400B0000/0x400B4000 are runtime-
# injected by renode_launcher.py via _AFEC_BASES_FOR_CHIP. Stepper
# pins cribbed from generic-duet2.cfg's stepper_x. Avoids PA9/PA10.
[manual_stepper basic_stepper]
step_pin: PD6
dir_pin: PD11
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
