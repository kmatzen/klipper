# Duet3 6HC (SAME70Q20B) end-to-end EMULATOR test config. Mirrors
# generic-duet3-6hc.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode UART2 pty on PD25/PD26) and two upstream
# config quirks worked around: stepper_x's endstop moved off PD25 (the
# UART2 host-link RX pin) to PD30 (IO4_in), and the duplicated
# [heater_fan heatbreak_fan] section renamed (the second instance, on
# PA15, becomes [heater_fan board_fan]). The real board is USB+CAN only,
# but the SAME70 USB tick byte-shuttle is unstable; the printer pin map
# this test exercises is independent of the host link, so it runs the
# serial-mode build (same70q20b.dict) in deterministic tick mode.
#
# This is the SAME70 per-printer test: four TMC5160s on a shared SPI
# daisy-chain (usart1 in SPI mode, shared cs_pin PD17, chain_length 6)
# driven by the renode_hooks TMC SPI chain responder (CPU-PC hook on
# spidev_transfer), plus adc_scaled vref/vssa-compensated thermistors on
# the SAME70 AFEC.

[stepper_x]
step_pin: PC18
dir_pin: PB5
enable_pin: !PA9
microsteps: 128
rotation_distance: 40
endstop_pin: PD30
position_endstop: 0
position_max: 450

[tmc5160 stepper_x]
cs_pin: PD17
spi_bus: usart1
chain_position: 1
chain_length: 6
interpolate: False
run_current: 1
sense_resistor: 0.05

[stepper_y]
step_pin: PC16
dir_pin: PD10
enable_pin: !PA9
microsteps: 128
rotation_distance: 40
endstop_pin: PD15
position_endstop: 0
position_max: 450

[tmc5160 stepper_y]
cs_pin: PD17
chain_position: 2
chain_length: 6
interpolate: False
run_current: 1.0
sense_resistor: 0.05

[stepper_z]
step_pin: PC28
dir_pin: PA4
enable_pin: !PA9
microsteps: 64
rotation_distance: 8
endstop_pin: PD28
position_endstop: 0
position_min: 0
position_max: 400

[tmc5160 stepper_z]
cs_pin: PD17
chain_position: 3
chain_length: 6
interpolate: False
run_current: 1.0
sense_resistor: 0.05

[adc_scaled vref_scaled]
vref_pin: PC0
vssa_pin: PC13

[extruder]
step_pin: PC1
dir_pin: PA22
enable_pin: !PA9
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA24
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
sensor_pin: vref_scaled:PC29
control: pid
pid_Kp: 30.089
pid_Ki: 2.229
pid_Kd: 101.550
min_temp: 0
max_temp: 285

[tmc5160 extruder]
cs_pin: PD17
chain_position: 4
chain_length: 6
interpolate: False
run_current: .6
sense_resistor: 0.05

[heater_fan heatbreak_fan]
pin: PC8
heater: extruder
heater_temp: 50.0

[heater_bed]
heater_pin: PA7
sensor_type: Generic 3950
sensor_pin: vref_scaled:PC15
control: pid
pullup_resistor: 2200
pid_Kp: 61.049
pid_Ki: 2.339
pid_Kd: 398.344
min_temp: 0
max_temp: 130

[heater_fan board_fan]
pin: PA15

[fan]
pin: PC5

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 3000
