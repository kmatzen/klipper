# Reduced TMC config: only the SPI variants. UART variants (tmc2208,
# tmc2209) need a software-uart bit-bang slave model that the
# bridge does not yet have. The hardware SPI TMCs (tmc2130, tmc5160,
# tmc2240, tmc2660) work via the bridge's spi_tmc register file.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2130 stepper_x]
cs_pin: PG0
diag1_pin: PE5
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc5160 stepper_y]
cs_pin: PG1
diag1_pin: PJ1
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.075

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2240_stepper_z:virtual_endstop
position_endstop: 0
position_max: 200

[tmc2240 stepper_z]
cs_pin: PG2
diag0_pin: PD3
run_current: 0.5
hold_current: 0.4

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2660 extruder]
cs_pin: PA0
sense_resistor: 0.040
run_current: 0.5

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
