# Duet2 Maestro (SAM4S8C) end-to-end EMULATOR test config. Mirrors
# generic-duet2-maestro.cfg with __EMULATOR_PTY__ swapped in for the
# host-link serial path. Exercises the full per-printer pin map
# through the renode SAM4S backend: TMC2208 software UART (PA9/PA10
# routed through renode_hooks.sw_uart's CPU-PC-hook bit driver) on
# each of the four steppers, vref_scaled adc_scaled with the bed +
# extruder thermistors against vref_pin PA17 / vssa_pin PA19, real
# GPIO endstops on PA24 / PB6 / PC10, software-PWM heater pins on
# PC1 / PC0, fan PWM on PC23. The empty_fixture-style smoke test
# (sam4s_smoke.test) only verifies boot + clocksync; this one runs
# the firmware through homing, temperature reads, and TMC register
# writes against the per-config peripheral wiring.

[stepper_x]
step_pin: PC20
dir_pin: PC18
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA24
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: PA9
tx_pin: PA10
select_pins: !PC14, !PC16, !PC17
sense_resistor: 0.075
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PC2
dir_pin: PA8
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB6
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: PA9
tx_pin: PA10
select_pins: PC14, !PC16, !PC17
sense_resistor: 0.075
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PC28
dir_pin: PB4
enable_pin: !PA1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC10
position_endstop: 0.5
position_max: 200

[tmc2208 stepper_z]
uart_pin: PA9
tx_pin: PA10
select_pins: !PC14, PC16, !PC17
sense_resistor: 0.075
run_current: 0.800
stealthchop_threshold: 999999

[adc_scaled vref_scaled]
vref_pin: PA17
vssa_pin: PA19

[extruder]
step_pin: PC4
dir_pin: PB7
enable_pin: !PA1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: !PC1
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: vref_scaled:PB0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2208 extruder]
uart_pin: PA9
tx_pin: PA10
select_pins: PC14, PC16, !PC17
sense_resistor: 0.075
run_current: 0.800
stealthchop_threshold: 999999

[heater_bed]
heater_pin: !PC0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: vref_scaled:PA20
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PC23

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
