# Cross-MCU AVR config -- like multi_mcu_avr.cfg, but stepper_z lives
# on the second MCU (`other:PL3`-style pins) so the fixture pusher's
# MCU-prefix routing is exercised. Without per-bridge step_trigger
# routing, _PIN_RE would skip the MCU-prefixed pins entirely and Z's
# homing endstop would never trigger.
[mcu]
serial: __EMULATOR_PTY__

[mcu other]
serial: __EMULATOR_PTY__

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: other:PL3
dir_pin: other:PL1
enable_pin: !other:PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^other:PD3
position_endstop: 0.5
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
