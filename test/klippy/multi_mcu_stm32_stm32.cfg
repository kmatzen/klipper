# Two-renode multi-MCU config -- stm32f103 main + stm32f407 satellite.
# Both bridges run under the same renode launcher binary but with
# separate platform .repls / firmware ELFs / pty pairs, validating
# that the runner spins up two independent renode processes in
# parallel and klippy clocksyncs against each in real time. Pin
# layout for the main mcu cribbed from generic-bigtreetech-skr-cr6
# (a known-good stm32f103 board) so the simavr-style PF/PJ/PL pins
# from the AVR template don't accidentally leak in.
[mcu]
serial: __EMULATOR_PTY__

[mcu other]
serial: __EMULATOR_PTY__

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: PC1
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: PC2
position_endstop: 0.0
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
