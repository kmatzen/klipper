# SAM3X8E boot/connect smoke test config. Exercises the Renode
# sam3x8e local platform path: SystemInit busy-wait on PMC_SR
# (flipflop) + EEFC FRDY (SAM4S_EEFC), generic/armcm_timer (DWT +
# SysTick), and the single unnumbered UART host link on PA8/PA9.
# Avoids PA8/PA9 (host link); PA15/PA14 / PD1 cribbed from
# generic-radds.cfg's stepper_x.
[manual_stepper basic_stepper]
step_pin: PA15
dir_pin: PA14
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
