# RP2040 boot/connect smoke test config. Exercises the local
# rp2040.repl plus the C# RP2040_Timer model
# (test/emulator/repl/rp2040_timer.cs, loaded into the runtime via
# `i @file.cs` before LoadPlatformDescription) plus the bit-set
# synthesis stubs for CLOCKS/RESETS/XOSC/PLL_SYS/PLL_USB plus the
# storeback regions for PSM/IO_BANK0/PADS_BANK0/WATCHDOG/ROSC/VREG.
# UART0 host link on gpio0/gpio1 (PL011). Stepper pins cribbed from
# generic-bigtreetech-skr-pico-v1.0.cfg's stepper_x. Avoids
# gpio0/gpio1 (host link).
[manual_stepper basic_stepper]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
