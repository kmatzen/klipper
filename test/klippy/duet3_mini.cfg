# Duet3 Mini 5+ (Microchip SAME54P20, pin-/register-compatible with the
# samd51p20 build target) end-to-end EMULATOR test config. Mirrors
# generic-duet3-mini.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode SERCOM0 pty on PA10/PA11, the
# samd51p20-serial firmware build) and the part-cooling [fan] dropped
# because the shipped config puts it on PA11, which collides with the
# SERCOM0 host-link RX pin in serial mode (USB on real hardware).
#
# This is the SAMD51/SAME54 per-printer counterpart to samd51_smoke
# (boot only). What it adds over the smoke test:
#
#   - TMC2209 MULTI-DROP UART. All four drivers share uart_pin PA1 /
#     tx_pin PA0 / select_pins PD0 with per-driver uart_address 0..3.
#     This reuses the renode_hooks sw_uart responder (CPU PC hooks on
#     tmcuart_*); _drive_rx drives the firmware-side RX bit through the
#     SAMD51 PORT model (gpio_a.OnGPIO), which the samd51p20.repl now
#     declares. The shared single sw_uart state + shared register file
#     serve all four addresses because klippy initialises drivers
#     sequentially (the same multidrop path skr_pico / skr_mini_e3_v3
#     exercise).
#   - adc_scaled (vref_pin PB5 / vssa_pin PB4) thermistors through the
#     SAMX5 ADC, served by the new test/emulator/samd51_adc_stub.py. All
#     four channels (vref, vssa, the two sensors) land on ADC1 @
#     0x43002000: vref=chan 7, vssa=chan 6, extruder PC1=chan 11, bed
#     PC0=chan 10 (adc_pins[] in src/atsamd/adc.c, chan %= 16). vref and
#     vssa get distinct fixture values so adc_scaled's (vref - vssa)
#     divisor is non-zero.
#
# The real Duet3 Mini host link is USB-CDC; the firmware here is the
# generic serial-mode samd51p20 build (host link on PA10/PA11) and the
# test exercises the pin map, which is independent of the host link. The
# gated path is motion-free.

[stepper_x]
step_pin: PC26
dir_pin: !PB3
enable_pin: !PC28
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC31
position_endstop: 0
position_max: 450

[tmc2209 stepper_x]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 0
run_current: 1
sense_resistor: 0.056

[stepper_y]
step_pin: PC25
dir_pin: PB29
enable_pin: !PC28
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC4
position_endstop: 0
position_max: 450

[tmc2209 stepper_y]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 1
run_current: 1
sense_resistor: 0.056

[stepper_z]
step_pin: PC24
dir_pin: PB28
enable_pin: !PC28
microsteps: 16
rotation_distance: 8
endstop_pin: PC5
position_endstop: 0
position_max: 400

[tmc2209 stepper_z]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 2
run_current: 1
sense_resistor: 0.056

[adc_scaled vref_scaled]
vref_pin: PB5
vssa_pin: PB4

[extruder]
step_pin: PC19
dir_pin: PD20
enable_pin: !PC28
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB13
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
sensor_pin: vref_scaled:PC1
control: pid
pid_Kp: 30.089
pid_Ki: 2.229
pid_Kd: 101.550
min_temp: 0
max_temp: 285

[tmc2209 extruder]
uart_pin: PA1
tx_pin: PA0
uart_address: 3
select_pins: PD0
run_current: 1
sense_resistor: 0.056

[heater_bed]
heater_pin: PB17
sensor_type: Generic 3950
sensor_pin: vref_scaled:PC0
control: pid
pullup_resistor: 2200
pid_Kp: 61.049
pid_Ki: 2.339
pid_Kd: 398.344
min_temp: 0
max_temp: 130

[heater_fan heatbreak_fan]
pin: PB11

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 3000
