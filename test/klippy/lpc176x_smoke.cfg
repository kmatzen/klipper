# LPC176x boot/connect smoke test config. Exercises the local
# lpc176x.repl plus the LPC_SC clock-controller stub at 0x400FC000
# (lpc_sc_stub.py: synthesizes SCS.OSCSTAT, PLL0STAT.PLOCK/PLLE/PLLC,
# PLL1STAT.PLOCK/PLLE/PLLC so SystemInit's busy-wait loops complete).
# UART0 host link on P0.3/P0.2 (NS16550 wideRegisters). Stepper pins
# cribbed from generic-smoothieboard.cfg's stepper_x. Avoids
# P0.3/P0.2 (host link).
[manual_stepper basic_stepper]
step_pin: P2.0
dir_pin: P0.5
enable_pin: !P0.4
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
