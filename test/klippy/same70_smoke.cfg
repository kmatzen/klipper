# SAME70Q20B boot/connect smoke test config. Exercises the local
# same70q20b.repl (extends upstream sam_e70.repl with a DWT - so
# generic/armcm_timer can read DWT->CYCCNT - and a UART2 instance at
# 0x400E1A00 since the upstream platform exposes USART0..2 only and
# klipper's SAME70 host link is UART2 on PD25/PD26). AFEC0/AFEC1
# stubs at 0x4003C000/0x40064000 are runtime-injected by
# renode_launcher.py. Stepper pins cribbed from generic-duet3-6hc's
# stepper_x. Avoids PD25/PD26 (host link).
[manual_stepper basic_stepper]
step_pin: PC18
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
