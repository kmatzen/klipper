# STM32G0 boot/connect smoke test config. Exercises the upstream
# Renode stm32g0 platform path (@platforms/cpus/stm32g0.repl, which
# ships its own RCC Python stub at 0x40021000 - no local rcc_stub
# needed unlike F1). On G0 src/stm32/clockline + generic/armcm_timer
# read the system-tick source the upstream platform models; USART1 is
# the host link Renode exposes as a pty. Stepper pins avoid the USART1
# host-link pins (PA9/PA10).
[manual_stepper basic_stepper]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
