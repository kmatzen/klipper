# Smoke test: minimal printer cfg pointed at the in-process MCU
# emulator. The serial path is rewritten by test_klippy.py at run time.

[manual_stepper basic_stepper]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[temperature_sensor chamber]
sensor_type: SHT3X
i2c_bus: twi

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
