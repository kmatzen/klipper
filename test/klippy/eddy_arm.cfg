# Test config for probe_eddy_current on an ARM MCU (STM32G0B1 under
# Renode). The mm-domain geometry (axis sizes, Z steps/mm, descend_z,
# probe offsets, speeds, calibration table) is copied from eddy.cfg so
# the two tests drive identical motion plans and the fixture ramp
# geometry transfers; the pin map is the SKR mini E3 v3 board layout
# already proven by skr_mini_e3_v3.cfg (TMC sections omitted - TMC
# coverage lives in that test). Unlike the AVR test this one runs the
# tap-family commands end-to-end under the emulator: the LDC1612 stays
# at its stock 400 SPS default and the fast ARM host link never
# saturates, so the clocksync frequency estimate stays clean through
# sustained sampling+motion (the AVR test's 250 kbaud ceiling is what
# forces its tap skip). The sensor sits on hardware I2C1 (PB6/PB7) with
# no intb_pin, putting the firmware on its timer-polled STATUS path
# (sensor_ldc1612.c), paced by the renode_hooks ldc1612_ramp model.
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# The tap descend targets position_min; with the default 0 the
# max_z_accel=100 deceleration zone (v^2/2a = 0.5 mm) would start
# above the fixture's contact knee (z ~= 0.25), so the diff_peak
# detector would see the deceleration's derivative decay instead of a
# clean constant-velocity contact. A negative floor - standard for
# real eddy-tap printers, which must press the nozzle slightly past
# contact - keeps the knee inside the constant-velocity region.
position_min: -1
position_max: 200

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 130

[probe_eddy_current eddy]
descend_z: 0.4
x_offset: -5
y_offset: -4
sensor_type: ldc1612
speed: 10.0
i2c_bus: i2c1_PB6_PB7
tap_threshold: 1500

[bed_mesh]
mesh_min: 10,10
mesh_max: 180,180

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# Dummy calibration data
[probe_eddy_current eddy]
calibrate =
    0.050000:3300000.000,0.100000:3200000.000,0.150000:3000000.000,
    0.200000:2900000.000,1.000000:2800000.000,5.000000:2700000.000
