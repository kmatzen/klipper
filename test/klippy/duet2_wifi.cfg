# Duet2 WiFi/Ethernet (Atmel SAM4E8E) end-to-end EMULATOR test config.
# Mirrors generic-duet2.cfg with the host-link serial path swapped to
# __EMULATOR_PTY__ (the Renode UART0 pty on PA9/PA10, the sam4e8e-serial
# firmware build).
#
# This is the SAM4E per-printer counterpart to sam4e_smoke (boot only),
# and the SAM4E sibling of duet2_maestro (SAM4S). What it adds over the
# smoke test, reusing existing infrastructure plus one targeted
# extension:
#
#   - TMC2660 over USART1-in-SPI mode. The four drivers share spi_bus
#     usart1 with per-driver cs_pins. TMC2660 uses 3-byte (20-bit)
#     datagrams rather than the 5-byte/40-bit datagrams of
#     tmc2130/5160/2240, so the fixture's spi_tmc_chip command switches
#     the renode_hooks spidev_transfer responder into its TMC2660
#     sub-mode (the renode hook sees the whole datagram in one call, so
#     no CS-pin tracking is needed; a shared RDSEL suffices since klippy
#     initialises drivers sequentially). The responder serves a non-zero
#     "se" (current-scaler) field at RDSEL2 so klippy's periodic check
#     doesn't read cs_actual=0.
#   - The SAM4E AFEC ADC (AFEC0 @ 0x400B0000). This is already wired in
#     the launcher for sam4e_smoke; the per-printer test exercises it
#     end to end via two thermistors. The extruder reads through AFEC0
#     channel index 7 (PC15, EPCOS 100K) and the bed through index 6
#     (PC13, EPCOS 100K) - see afec_pins[] in src/atsam/sam4e_afec.c
#     (g.chan is the channel index, which afec_stub.py serves via
#     AFE_CSELR). The same afec_stub.py SAME70 uses serves SAM4E.
#
# Trimmed relative to the shipped config: the commented second extruder
# and extra fans are dropped. The real Duet2 host link is USB; the
# firmware here is the generic serial-mode sam4e8e build and the test
# exercises the pin map, which is independent of the host link. The
# gated path is motion-free.

[stepper_x]
step_pin: PD6
dir_pin: PD11
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC14
position_endstop: 0
position_max: 250

[tmc2660 stepper_x]
cs_pin: PD14
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[stepper_y]
step_pin: PD7
dir_pin: !PD12
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA2
position_endstop: 0
position_max: 210

[tmc2660 stepper_y]
cs_pin: PC9
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[stepper_z]
step_pin: PD8
dir_pin: PD13
enable_pin: !PC6
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD29
position_endstop: 0.5
position_max: 200

[tmc2660 stepper_z]
cs_pin: PC10
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[extruder]
step_pin: PD5
dir_pin: PA1
enable_pin: !PC6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: !PA20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC15
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2660 extruder]
cs_pin: PC17
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[heater_bed]
heater_pin: !PA19
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC13
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PC23

[mcu]
serial: __EMULATOR_PTY__

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
