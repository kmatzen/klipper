# Test config for ADXL345 accelerometer streaming + resonance testing
# under the MCU emulator (simavr / atmega2560). Minimal cartesian
# geometry (eddy.cfg pin map, no heaters); the [adxl345] rate is 800 -
# a stock chip rate the AVR's 250 kbaud link comfortably carries
# (~4.2 KB/s of bulk samples vs the stock 3200's ~17 KB/s, which
# would sit at ~70% of the link during motion).
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD2
position_endstop: 0
position_max: 200

[adxl345]
cs_pin: PK7
rate: 800

[resonance_tester]
probe_points: 100,100,20
accel_chip: adxl345

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 7000
max_z_velocity: 5
max_z_accel: 100
